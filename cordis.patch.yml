# @goodjin2/dsh-codex 的挂载配置。
#
# Codex 模型行：DSH 自己的循环读文件、跑命令、审批，这一行只回答「向模型要下一句话」。
# 请求由本仓直接发到 OpenAI 的 /responses 端点，用本地 Codex CLI 的 OAuth 凭据认证。
#
# 用法：把下面的 insert 段合并进你的 profile 的 cordis.patch.yml。

- insert:
    # Codex 模型行：把 `acp:acp-codex-global` 这条 provider 路由挂进宿主模型目录，
    # 模型流交给 codexModelStream。hideFromRoster：用户选的是模型而不是这个 preset。
    # collapseEfforts：Codex 的模型 id 带 `[effort]` 后缀，把同 base 折成一条、强度另走轴。
    - id: acp-codex-global
      name: '@goodjin2/dsh-codex'
      config:
        presetId: acp-codex-global
        agent: codex-global
        hideFromRoster: true
        collapseEfforts: true
        efforts:
          - id: low
            name: Low
          - id: medium
            name: Medium
          - id: high
            name: High
          - id: xhigh
            name: xHigh
          - id: max
            name: Max
        models:
          - id: gpt-6.1-sol
            name: "GPT-6.1-Sol"
            description: "最新旗舰 · 500k 上下文"
            contextWindow: 500000
          - id: gpt-6.1-terra
            name: "GPT-6.1-Terra"
            contextWindow: 500000
          - id: gpt-6-astra
            name: "GPT-6-Astra"
            contextWindow: 272000
          - id: gpt-6-sol
            name: "GPT-6-Sol"
            contextWindow: 272000
          - id: gpt-6-luna
            name: "GPT-6-Luna"
            contextWindow: 272000
          - id: gpt-5.6-sol
            name: "GPT-5.6-Sol"
            contextWindow: 272000
          - id: gpt-5.6-terra
            name: "GPT-5.6-Terra"
            contextWindow: 272000
          - id: gpt-5.6-luna
            name: "GPT-5.6-Luna"
            contextWindow: 272000

    # Codex 配额路由：浏览器在设置里查看配额使用情况。
    - id: acp-codex-quota
      name: '@goodjin2/dsh-codex/codex-quota'
      inject:
        - webServer
        - connection

    # Codex 宿主路由：会话状态与模型清单。
    - id: acp-codex-routes
      name: '@goodjin2/dsh-codex/codex-routes'
      inject:
        - webServer
        - connection
